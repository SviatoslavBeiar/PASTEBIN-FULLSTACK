

# --- Profiles ---
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- MySQL (metadata) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pastebin123?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- MongoDB (paste content) ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pastebin}

# --- Mail ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

## --- App specific ---
paste.expiration-default-minutes=${PASTE_EXPIRATION_MINUTES:60}
paste.notify-window-minutes=${PASTE_NOTIFY_WINDOW_MINUTES:15}
paste.scheduler-fixed-rate-ms=${PASTE_SCHEDULER_MS:30000}
paste.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
